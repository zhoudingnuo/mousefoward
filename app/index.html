<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鼠标转发 · 锁定</title>
<style>
  /* 和参考实现一样的深色面板: 一个按钮 + 实时状态。这里只要一个按钮。 */
  :root {
    --bg: #16181c; --panel: #1d2025; --line: #2a2f36; --text: #d7dbe0;
    --dim: #8b939d; --accent: #4f8ef7; --warn: #e0a03a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  button {
    width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text); font-size: 15px; cursor: pointer;
  }
  button.on { border-color: var(--warn); background: #2a2118; color: #f0c88a; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #454b53; }
  .dot.ok { background: #3fbf6a; }
  .dot.warn { background: var(--warn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 10px; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-family: Consolas, monospace; font-size: 15px; margin-top: 3px; }
  .v.neg { color: var(--accent); }
  #verdict { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
            background: var(--panel); font-size: 13px; white-space: pre-wrap; }
  #verdict.bad { border-color: #a04a4a; color: #e88b8b; }

  /* 锁定时整屏变黑(参考实现是一个全屏抓输入的面屏)。页面就是那块面板:
   * 采集走的是 Raw Input(RIDEV_INPUTSINK), 和焦点在哪个窗口无关, 所以黑屏期间转发照旧。 */
  .screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 16px; }
  .screen.hidden, .wrap.hidden { display: none; }
  .screen:fullscreen { width: 100vw; height: 100vh; }
  ::backdrop { background: #000; }
  .screen .slot { width: 320px; }
  .screen .mini { color: #6f7780; font-family: Consolas, monospace; font-size: 13px; }
  .screen .esc { color: #454b53; font-size: 12px; }
  .screen .fsline { color: #454b53; font-size: 12px; }
  .screen .fsline.bad { color: #e88b8b; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap" id="panel">
  <h1>鼠标转发 · 锁定</h1>
  <div class="sub">本端 → 板子(USBFS CDC) → 另一台机器(USBHS HID)</div>

  <button id="lock">🔒 锁定 (关)</button>
  <div class="hint">点一下: 全屏黑屏, 本端光标被拉回屏幕中心, 手只控制另一台机器。再点一下或按 Esc 退出全屏和锁定。</div>

  <div class="row"><span class="dot" id="dot"></span><span id="state">未锁定</span></div>

  <div class="grid">
    <div class="cell"><div class="k">包率</div><div class="v" id="rate">0 /s</div></div>
    <div class="cell"><div class="k">已发</div><div class="v" id="sent">0</div></div>
    <div class="cell"><div class="k">本端串口</div><div class="v" id="port">—</div></div>
    <div class="cell"><div class="k">采集</div><div class="v" id="cap">—</div></div>
    <div class="cell"><div class="k">本端光标</div><div class="v" id="cursor">—</div></div>
    <div class="cell"><div class="k">拉回中心</div><div class="v" id="recenter">0</div></div>
  </div>

  <div id="verdict">还没有状态行。安静 5 秒以后才会读(转发的路上不能读: 那是一个会挂住的往返)。</div>
</div>

<div class="screen hidden" id="screen">
  <div class="slot" id="slot"></div>
  <div class="mini" id="mini">—</div>
  <div class="fsline" id="fsline">全屏: —</div>
  <div class="esc">按 Esc 退出全屏和锁定</div>
</div>

<script>
const btn = document.getElementById('lock');
const dot = document.getElementById('dot');
const stateText = document.getElementById('state');
const verdict = document.getElementById('verdict');
const panel = document.getElementById('panel');
const screen = document.getElementById('screen');
const slot = document.getElementById('slot');
const mini = document.getElementById('mini');
const fsline = document.getElementById('fsline');
const home = btn.parentNode;          // 只有一个按钮: 锁定时把它搬到黑屏里, 解锁时搬回来
let exitByUs = false;                 // 我们自己退出的全屏, 不能再当成"按 Esc 退出"处理

function showLock(on) {
  if (on) {
    panel.classList.add('hidden');
    screen.classList.remove('hidden');
    slot.appendChild(btn);
  } else {
    screen.classList.add('hidden');
    panel.classList.remove('hidden');
    home.appendChild(btn);
    if (document.fullscreenElement) { exitByUs = true; document.exitFullscreen(); }
  }
}

function showFs(on, err) {
  fsline.textContent = on ? '全屏: 开' : ('全屏: 没进' + (err ? ' — ' + err : ''));
  fsline.className = 'fsline' + (on ? '' : ' bad');
}

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET' };
  if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

/* requestFullscreen 只能在用户手势里调用, 所以点按钮时先进全屏, 再发请求。 */
btn.addEventListener('click', () => {
  if (!locked) {
    try { screen.requestFullscreen(); } catch (e) { showFs(false, e.message); }
  } else if (document.fullscreenElement) {
    exitByUs = true;
    document.exitFullscreen();
  }
  api('/api/lock', { toggle: true });
});

// 全屏里按 Esc 被浏览器用掉了(先退出全屏), keydown 收不到 —— 所以"退出全屏"就等于"退出锁定"。
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  if (exitByUs) { exitByUs = false; showFs(on); return; }
  showFs(on);
  if (!on && locked) api('/api/lock', { enabled: false });
});

// 非全屏时按 Esc 仍然直接解锁。
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && locked) api('/api/lock', { enabled: false });
});

let locked = false;
let wasLocked = false;

function set(id, text, neg) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'v' + (neg ? ' neg' : '');
}

async function poll() {
  let d;
  try { d = await (await fetch('/api/state')).json(); } catch (e) { return; }

  locked = d.lock;
  if (locked !== wasLocked) { showLock(locked); wasLocked = locked; }
  btn.textContent = locked ? '🔓 锁定 (开) — 按 Esc 退出' : '🔒 锁定 (关)';
  btn.className = locked ? 'on' : '';
  dot.className = locked ? 'dot warn' : 'dot';
  stateText.textContent = locked ? '已锁定 — 本端光标被拉回中心, 手只控制另一台机器' : '未锁定';

  set('rate', d.rate + ' 包/秒');
  set('sent', d.sent.total + ' 包 (接口 ' + d.sent.queued + ')');
  set('port', d.port || '没开串口');
  const c = d.capture;
  set('cap', c.registered ? ('鼠标 ' + c.mouse + ' · 键盘 ' + c.key + (c.unmapped ? ' · 没映射 ' + c.unmapped : '')) : '未注册: ' + c.stage);
  set('cursor', d.cursor ? d.cursor.x + ',' + d.cursor.y : '—');
  set('recenter', d.recenter);
  mini.textContent = d.rate + ' 包/秒 · ' + d.sent.total + ' 包 · 拉回中心 ' + d.recenter;
  showFs(!!document.fullscreenElement);

  if (d.verdict) {
    verdict.textContent = d.verdict;
    verdict.className = /没被|读不到|断了|一直忙|没多|读不全/.test(d.verdict) ? 'bad' : '';
  }
}

poll();
setInterval(poll, 200);
</script>
</body>
</html>
